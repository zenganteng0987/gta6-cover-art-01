<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Poster — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Poster controls">
    <h1>VICE POSTER</h1>
    <p class="tagline">Your photo and a caption, made into a multi-panel poster. Everything runs offline, in this page.</p>

    <div class="group">
      <span class="group-label">Photo</span>
      <label class="file-label">Choose your photo
        <input id="photo" type="file" accept="image/*">
      </label>
      <div class="button-row" id="photo-buttons"></div>
      <button id="fill-all" type="button">Fill every panel with this photo</button>
    </div>

    <div class="group">
      <span class="group-label">Layout</span>
      <div class="button-row" id="layout-buttons"></div>
    </div>

    <div class="group">
      <span class="group-label">Colour grade</span>
      <div class="button-row" id="grade-buttons"></div>
      <label class="slider-label">Grade strength <span id="strength-value">70%</span>
        <input id="strength" type="range" min="0" max="100" value="70">
      </label>
    </div>

    <div class="group">
      <span class="group-label">Words</span>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Vice City"></label>
      <label>Ribbon subtitle <input id="subtitle" type="text" maxlength="48" value="Welcome to Vice"></label>
      <label>Star badge <input id="star" type="text" maxlength="20" value="Five Star"></label>
    </div>

    <div class="group">
      <span class="group-label" id="panel-label">Panel 1 of 5</span>
      <label class="slider-label">Zoom <span id="zoom-value">1.00x</span>
        <input id="panel-zoom" type="range" min="100" max="300" value="100">
      </label>
      <label class="slider-label">Move sideways
        <input id="panel-x" type="range" min="-60" max="60" value="0">
      </label>
      <label class="slider-label">Move up and down
        <input id="panel-y" type="range" min="-60" max="60" value="0">
      </label>
    </div>

    <div class="group">
      <span class="group-label">Export PNG</span>
      <div class="button-row" id="size-buttons"></div>
    </div>

    <p id="status" role="status"></p>
  </section>
  <section class="preview-wrap" aria-label="Cover preview">
    <canvas id="preview" width="1080" height="1080" aria-label="The cover"></canvas>
    <p class="hint">Click a panel to select it, then drag its photo or scroll to zoom.</p>
  </section>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
